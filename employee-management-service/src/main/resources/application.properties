spring.application.name=employee-management

spring.datasource.url=jdbc:postgresql://localhost:5432/employee_management
spring.datasource.username=postgres
spring.datasource.password=pgdbadmin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO
# Log SQL statements generated by Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Log values bound to SQL parameters
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.data.repository=TRACE